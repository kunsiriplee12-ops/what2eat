<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHAT2EAT</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <header class="hero-header">
    <video class="hero-background" autoplay loop muted playsinline aria-hidden="true" tabindex="-1">
      <source src="./videos/hero-bg.mp4" type="video/mp4">
    </video>
    <h1>WHAT2EAT</h1>
    <p>Weekly Meal Planner & Favorites</p>
  </header>

  <section class="category-section" aria-labelledby="categoryHeading">
    <h2 id="categoryHeading">Categories</h2>
    <div id="categoryContainer" class="category-grid"></div>
  </section>

  <main class="dashboard-layout">
    <section class="dashboard-section" aria-labelledby="favoritesHeading">
      <h2 id="favoritesHeading">Favorites</h2>
      <div id="favoriteContainer"></div>
    </section>

    <section class="dashboard-section" aria-labelledby="queueHeading">
      <h2 id="queueHeading">Weekly Meals</h2>
      <div id="queueContainer"></div>
      <div class="queue-actions">
        <button class="queue-action queue-action-add" type="button" onclick="generateWeeklyPlan()" aria-label="เพิ่มเข้าตาราง" title="เพิ่มเข้าตาราง">
          <i data-lucide="calendar-plus" aria-hidden="true"></i>
        </button>
        <button class="queue-action queue-action-clear" type="button" onclick="clearPlanner()" aria-label="ล้างตารางอาหาร" title="ล้างตารางอาหาร">
          <i data-lucide="calendar-x" aria-hidden="true"></i>
        </button>
      </div>
    </section>

    <section class="dashboard-section" aria-labelledby="plannerHeading">
      <h2 id="plannerHeading">Weekly Meal Planner</h2>
      <div class="week-grid">
        <div class="day-card">
          <h3>Monday</h3>
          <div id="Monday"></div>
        </div>
        <div class="day-card">
          <h3>Tuesday</h3>
          <div id="Tuesday"></div>
        </div>
        <div class="day-card">
          <h3>Wednesday</h3>
          <div id="Wednesday"></div>
        </div>
        <div class="day-card">
          <h3>Thursday</h3>
          <div id="Thursday"></div>
        </div>
        <div class="day-card">
          <h3>Friday</h3>
          <div id="Friday"></div>
        </div>
        <div class="day-card">
          <h3>Saturday</h3>
          <div id="Saturday"></div>
        </div>
        <div class="day-card">
          <h3>Sunday</h3>
          <div id="Sunday"></div>
        </div>
      </div>
    </section>

    <section class="dashboard-section meal-catalog" aria-labelledby="catalogHeading">
      <h2 id="catalogHeading">Meal Catalog</h2>
      <p id="currentCategory" aria-live="polite">กำลังโหลดหมวดอาหาร...</p>
      <div id="mealContainer" class="meal-grid"></div>
    </section>
  </main>

  <!-- ==========================
       MODAL
  =========================== -->

  <div id="mealModal"
       class="modal hidden">

    <div class="modal-content">

      <button
        class="close-btn"
        type="button"
        aria-label="Close meal details"
        title="Close"
        onclick="closeModal()">
        X
      </button>

      <div id="mealDetail">
      </div>

    </div>

  </div>
  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <script src="dashboard.js"></script>

</body>
</html>
