<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHAT2EAT</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div id="categoryPage">
  <!-- ==========================
       HEADER
  =========================== -->

  <header>
    <h1>WHAT2EAT</h1>
    <p>Weekly Meal Planner & Favorites</p>
  </header>

  <!-- ==========================
       SEARCH
  =========================== -->
<!--======================
  <section class="search-section">

    <input
      type="text"
      id="searchInput"
      placeholder="Search meal..."
    >

    <button onclick="searchMeal()">
      Search
    </button>

  </section>

  <!==========================
       SORT
       Bubble Sort
  =========================== -->



  </section>

  <!-- ==========================
       CATEGORY
  =========================== -->

  <section>

    <div id="categoryContainer"
         class="category-grid">
    </div>

  </section>

  </div>

  <div
  id="dashboardPage"
  class="hidden">

  <!-- ==========================
       FAVORITES
       Array
  =========================== -->

  <section>

    <h2>Favorites</h2>

    <div id="favoriteContainer">
    </div>

  </section>

  <!-- ==========================
       QUEUE
       Queue FIFO
  =========================== -->

  <section>

    <h2>Weekly Meal</h2>

    <div id="queueContainer">
    </div>

    <button onclick="generateWeeklyPlan()">
      เพิ่มเข้าตาราง
    </button>
    <button onclick="clearPlanner()">
      ล้างตารางอาหาร
    </button>

  </section>

  <!-- ==========================
       WEEKLY PLAN
       Hash Map
  =========================== -->

  <section>

    <h2>Weekly Meal Planner</h2>

    <div class="week-grid">

      <div class="day-card">
        <h3>Monday</h3>
        <div id="Monday"></div>
      </div>

      <div class="day-card">
        <h3>Tuesday</h3>
        <div id="Tuesday"></div>
      </div>

      <div class="day-card">
        <h3>Wednesday</h3>
        <div id="Wednesday"></div>
      </div>

      <div class="day-card">
        <h3>Thursday</h3>
        <div id="Thursday"></div>
      </div>

      <div class="day-card">
        <h3>Friday</h3>
        <div id="Friday"></div>
      </div>

      <div class="day-card">
        <h3>Saturday</h3>
        <div id="Saturday"></div>
      </div>

      <div class="day-card">
        <h3>Sunday</h3>
        <div id="Sunday"></div>
      </div>

    </div>

  </section>

   <!-- ==========================
       MEALS
  =========================== -->
<section>

    <button onclick="backToCategories()">
    กลับไปเลือกหมวด
    </button>

    <h2 id="currentCategory">
    หมวดอาหาร
    </h2>

    <h2>Meals</h2>

    <div id="mealContainer"
         class="meal-grid">
    </div>

  </section>

  <!-- ==========================
       MODAL
  =========================== -->

  <div id="mealModal"
       class="modal hidden">

    <div class="modal-content">

      <button
        class="close-btn"
        onclick="closeModal()">
        X
      </button>

      <div id="mealDetail">
      </div>

    </div>

  </div>
</div>
  <script src="dashboard.js"></script>

</body>
</html>
